<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Econometric model-risk atlas</title><desc id="desc">Adaptive light and dark five-panel mathematical visual for omitted-variable bias, leverage sensitivity, model selection, stationarity and structural breaks.</desc><style>:root{--bg:#fff;--panel:#f8fafc;--fg:#0f172a;--muted:#475569;--border:#94a3b8;--grid:#e2e8f0;--obs:#0369a1;--state:#1d4ed8;--viable:#047857;--unc:#b45309;--haz:#b91c1c;--iface:#7e22ce;--dec:#a16207}@media(prefers-color-scheme:dark){:root{--bg:#07111f;--panel:#0e1d31;--fg:#eaf1f8;--muted:#9eb0c3;--border:#355a7b;--grid:#28445f;--obs:#38bdf8;--state:#60a5fa;--viable:#34d399;--unc:#fbbf24;--haz:#fb7185;--iface:#c084fc;--dec:#facc15}}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--border)}.fg{fill:var(--fg)}.muted{fill:var(--muted)}.grid{stroke:var(--grid);fill:none}.state{stroke:var(--state);fill:none}.viable{stroke:var(--viable);fill:none}.unc{stroke:var(--unc);fill:none}.haz{stroke:var(--haz);fill:none}.iface{stroke:var(--iface);fill:none}.dec{stroke:var(--dec);fill:none}text{font-family:Inter,Segoe UI,Arial,sans-serif}.math{font-family:Georgia,'Times New Roman',serif}</style><rect class="bg" width="1600" height="900" rx="28"/><g class="grid" opacity=".3"><path d="M0 90H1600M0 180H1600M0 270H1600M0 360H1600M0 450H1600M0 540H1600M0 630H1600M0 720H1600M0 810H1600"/><path d="M160 0V900M320 0V900M480 0V900M640 0V900M800 0V900M960 0V900M1120 0V900M1280 0V900M1440 0V900"/></g><text x="70" y="72" class="fg" font-size="36" font-weight="800">ECONOMETRIC MODEL-RISK ATLAS</text><text x="70" y="106" class="muted" font-size="16">identification · leverage · parsimony · stochastic structure · regime change</text>
<rect x="70" y="148" width="440" height="285" rx="20" class="panel"/><text x="95" y="187" class="fg" font-size="21" font-weight="700">1 · Omitted-variable bias</text><text x="95" y="228" class="fg math" font-size="18">plim β̂omit=β+γ Cov(X,Z)/Var(X)</text><path d="M110 385H465M110 385V250" stroke="var(--muted)"/><path d="M120 360L455 265" class="viable" stroke-width="4"/><path d="M120 345L455 220" class="haz" stroke-width="4"/><text x="320" y="242" fill="var(--haz)" font-size="13">misspecified slope</text><text x="315" y="304" fill="var(--viable)" font-size="13">structural slope</text><g fill="var(--unc)"><circle cx="225" cy="330" r="6"/><circle cx="280" cy="310" r="6"/><circle cx="340" cy="294" r="6"/></g>
<rect x="555" y="148" width="440" height="285" rx="20" class="panel"/><text x="580" y="187" class="fg" font-size="21" font-weight="700">2 · Leverage / influence</text><text x="580" y="228" class="fg math" font-size="18">hᵢᵢ=xᵢᵀ(XᵀX)⁻¹xᵢ</text><path d="M595 385H950M595 385V250" stroke="var(--muted)"/><g fill="var(--iface)"><circle cx="625" cy="353" r="5"/><circle cx="660" cy="340" r="5"/><circle cx="695" cy="330" r="5"/><circle cx="730" cy="311" r="5"/><circle cx="765" cy="302" r="5"/><circle cx="800" cy="287" r="5"/></g><circle cx="920" cy="255" r="10" fill="var(--haz)"/><path d="M610 360L940 240" class="haz" stroke-width="3"/><path d="M610 355L820 285" class="viable" stroke-width="3" stroke-dasharray="7 6"/><text x="820" y="228" fill="var(--haz)" font-size="12">high leverage</text>
<rect x="1040" y="148" width="490" height="285" rx="20" class="panel"/><text x="1065" y="187" class="fg" font-size="21" font-weight="700">3 · Model selection</text><text x="1065" y="228" class="fg math" font-size="18">AIC=2k−2ln L̂ · BIC=k ln n−2ln L̂</text><path d="M1080 385H1490M1080 385V250" stroke="var(--muted)"/><path d="M1095 290C1160 250 1220 255 1280 300S1400 373 1475 330" class="state" stroke-width="4"/><path d="M1095 350C1160 315 1210 282 1265 275S1380 280 1475 320" class="dec" stroke-width="4"/><path d="M1280 257V390" class="viable" stroke-width="2" stroke-dasharray="6 5"/><text x="1290" y="272" class="muted" font-size="12">selected complexity</text>
<rect x="70" y="475" width="675" height="300" rx="20" class="panel"/><text x="95" y="515" class="fg" font-size="21" font-weight="700">4 · Stationarity / unit-root diagnostics</text><text x="95" y="556" class="fg math" font-size="18">Δyₜ=α+βt+γyₜ₋₁+ΣδᵢΔyₜ₋ᵢ+εₜ</text><path d="M110 716H705M110 716V570" stroke="var(--muted)"/><path d="M115 650C140 620 165 690 190 646S240 620 265 655S315 684 340 641S390 610 420 648S470 686 500 640S555 607 585 647S645 690 700 650" class="viable" stroke-width="3"/><path d="M115 700C165 683 205 666 250 646S340 620 390 600S490 575 545 557S620 540 700 525" class="haz" stroke-width="3" stroke-dasharray="8 6"/><text x="500" y="683" fill="var(--viable)" font-size="12">stationary / mean-reverting</text><text x="500" y="553" fill="var(--haz)" font-size="12">persistent / trending</text>
<rect x="790" y="475" width="740" height="300" rx="20" class="panel"/><text x="815" y="515" class="fg" font-size="21" font-weight="700">5 · Structural break / regime change</text><text x="815" y="556" class="fg math" font-size="18">yₜ=xₜᵀβ₁+εₜ, t≤τ · yₜ=xₜᵀβ₂+εₜ, t&gt;τ</text><path d="M830 716H1490M830 716V570" stroke="var(--muted)"/><path d="M835 672C910 662 990 646 1070 640" class="state" stroke-width="4"/><path d="M1070 610C1160 595 1280 570 1480 552" class="haz" stroke-width="4"/><path d="M1070 565V720" class="unc" stroke-width="3" stroke-dasharray="6 5"/><text x="1083" y="585" class="muted" font-size="13">τ break</text><text x="900" y="745" fill="var(--state)" font-size="12">regime 1</text><text x="1290" y="590" fill="var(--haz)" font-size="12">regime 2</text><rect x="250" y="806" width="1100" height="48" rx="14" class="panel"/><text x="800" y="836" text-anchor="middle" class="fg" font-size="14">estimand → assumptions → computation → diagnostic → sensitivity → model-risk boundary → bounded interpretation</text><text x="70" y="885" class="muted" font-size="13">Theme changes presentation only; estimands, equations, diagnostic meaning, sample evidence and model-risk boundaries remain invariant.</text></svg>