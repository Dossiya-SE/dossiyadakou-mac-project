<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Econometric model-risk atlas</title><desc id="d">Five-panel mathematical visual for omitted variable bias, outlier sensitivity, model selection, stationarity and structural breaks.</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#08111f"/><stop offset="1" stop-color="#15233b"/></linearGradient><pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#304967" stroke-opacity=".22"/></pattern><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6z" fill="#7dd3fc"/></marker></defs><rect width="1600" height="900" rx="30" fill="url(#bg)"/><rect x="24" y="24" width="1552" height="852" rx="24" fill="url(#grid)" stroke="#38536d"/><g font-family="Inter,Segoe UI,Arial"><text x="70" y="74" fill="#eff6ff" font-size="32" font-weight="800">ECONOMETRIC MODEL-RISK ATLAS</text><text x="70" y="107" fill="#a9bfd5" font-size="16">identification · leverage · parsimony · stochastic structure · regime change</text>
<rect x="70" y="148" width="440" height="285" rx="20" fill="#111f34" stroke="#3b82f6"/><text x="96" y="184" fill="#93c5fd" font-size="20" font-weight="700">1 · Omitted-variable bias</text><text x="96" y="216" fill="#e5efff" font-size="16">plim β̂ₒₘᵢₜ = β + γ Cov(X,Z)/Var(X)</text><line x1="110" y1="385" x2="465" y2="385" stroke="#5c7088"/><line x1="110" y1="385" x2="110" y2="250" stroke="#5c7088"/><path d="M120 360L455 265" stroke="#34d399" stroke-width="4"/><path d="M120 345L455 220" stroke="#fb7185" stroke-width="4"/><text x="330" y="243" fill="#fda4af" font-size="13">misspecified slope</text><text x="324" y="302" fill="#86efac" font-size="13">structural slope</text><circle cx="225" cy="330" r="6" fill="#fde68a"/><circle cx="280" cy="310" r="6" fill="#fde68a"/><circle cx="340" cy="294" r="6" fill="#fde68a"/>
<rect x="555" y="148" width="440" height="285" rx="20" fill="#111f34" stroke="#8b5cf6"/><text x="581" y="184" fill="#c4b5fd" font-size="20" font-weight="700">2 · Outlier / leverage sensitivity</text><text x="581" y="216" fill="#eef2ff" font-size="16">hᵢᵢ = xᵢᵀ(XᵀX)⁻¹xᵢ</text><line x1="595" y1="385" x2="950" y2="385" stroke="#5c7088"/><line x1="595" y1="385" x2="595" y2="250" stroke="#5c7088"/><g fill="#a5b4fc"><circle cx="625" cy="353" r="5"/><circle cx="660" cy="340" r="5"/><circle cx="695" cy="330" r="5"/><circle cx="730" cy="311" r="5"/><circle cx="765" cy="302" r="5"/><circle cx="800" cy="287" r="5"/></g><circle cx="920" cy="255" r="10" fill="#fb7185"/><path d="M610 360L940 240" stroke="#fb7185" stroke-width="3"/><path d="M610 355L820 285" stroke="#34d399" stroke-width="3" stroke-dasharray="7 6"/><text x="818" y="226" fill="#fda4af" font-size="12">high leverage</text>
<rect x="1040" y="148" width="490" height="285" rx="20" fill="#111f34" stroke="#f59e0b"/><text x="1066" y="184" fill="#fde68a" font-size="20" font-weight="700">3 · Model selection</text><text x="1066" y="216" fill="#fff7df" font-size="16">AIC = 2k−2 ln L̂   ·   BIC = k ln n−2 ln L̂</text><line x1="1080" y1="385" x2="1490" y2="385" stroke="#5c7088"/><line x1="1080" y1="385" x2="1080" y2="250" stroke="#5c7088"/><path d="M1095 290 C1160 250,1220 255,1280 300 S1400 373,1475 330" fill="none" stroke="#38bdf8" stroke-width="4"/><path d="M1095 350 C1160 315,1210 282,1265 275 S1380 280,1475 320" fill="none" stroke="#fbbf24" stroke-width="4"/><line x1="1280" y1="257" x2="1280" y2="390" stroke="#34d399" stroke-width="2" stroke-dasharray="6 5"/><text x="1290" y="272" fill="#86efac" font-size="12">selected complexity</text>
<rect x="70" y="475" width="675" height="300" rx="20" fill="#111f34" stroke="#14b8a6"/><text x="96" y="512" fill="#99f6e4" font-size="20" font-weight="700">4 · Stationarity / unit-root diagnostics</text><text x="96" y="544" fill="#ecfeff" font-size="16">Δyₜ = α + βt + γyₜ₋₁ + ΣδᵢΔyₜ₋ᵢ + εₜ</text><line x1="110" y1="716" x2="705" y2="716" stroke="#5c7088"/><line x1="110" y1="716" x2="110" y2="570" stroke="#5c7088"/><path d="M115 650 C140 620,165 690,190 646 S240 620,265 655 S315 684,340 641 S390 610,420 648 S470 686,500 640 S555 607,585 647 S645 690,700 650" fill="none" stroke="#34d399" stroke-width="3"/><path d="M115 700 C165 683,205 666,250 646 S340 620,390 600 S490 575,545 557 S620 540,700 525" fill="none" stroke="#fb7185" stroke-width="3" stroke-dasharray="8 6"/><text x="510" y="682" fill="#86efac" font-size="12">mean-reverting / stationary</text><text x="510" y="554" fill="#fda4af" font-size="12">persistent / trending path</text>
<rect x="790" y="475" width="740" height="300" rx="20" fill="#111f34" stroke="#f43f5e"/><text x="816" y="512" fill="#fda4af" font-size="20" font-weight="700">5 · Structural break / regime change</text><text x="816" y="544" fill="#fff1f2" font-size="16">yₜ = xₜᵀβ₁ + εₜ, t≤τ   ·   yₜ = xₜᵀβ₂ + εₜ, t&gt;τ</text><line x1="830" y1="716" x2="1490" y2="716" stroke="#5c7088"/><line x1="830" y1="716" x2="830" y2="570" stroke="#5c7088"/><path d="M835 672 C910 662,990 646,1070 640" fill="none" stroke="#60a5fa" stroke-width="4"/><path d="M1070 610 C1160 595,1280 570,1480 552" fill="none" stroke="#fb7185" stroke-width="4"/><line x1="1070" y1="565" x2="1070" y2="720" stroke="#fbbf24" stroke-width="3" stroke-dasharray="6 5"/><text x="1083" y="585" fill="#fde68a" font-size="13">τ break</text><text x="900" y="745" fill="#93c5fd" font-size="12">regime 1</text><text x="1290" y="590" fill="#fda4af" font-size="12">regime 2</text>
<rect x="250" y="806" width="1100" height="45" rx="14" fill="#0c1b2b" stroke="#3d5870"/><text x="800" y="835" text-anchor="middle" fill="#c9d7e4" font-size="14">Theory → simulation / data → estimator → diagnostic → sensitivity → model-risk boundary → bounded interpretation</text></g></svg>